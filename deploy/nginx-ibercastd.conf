# Nginx for IberCast: serves the player static build and reverse-proxies the
# daemon API on the same origin (avoids CORS entirely).
#
# Install:
#   sudo cp deploy/nginx-ibercastd.conf /etc/nginx/sites-available/ibercastd
#   sudo ln -s /etc/nginx/sites-available/ibercastd /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # optional: free port 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: run `sudo certbot --nginx -d yourdomain.example` after this is live.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Player static build (built with `npm run build` → dist/)
    root /opt/ibercastd/player;
    index index.html;

    # API: reverse proxy to ibercastd (same origin → no CORS)
    location /api/ {
        proxy_pass http://127.0.0.1:8585;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads can be large (up to 1 GB)
        client_max_body_size 1100m;
        proxy_request_buffering off;

        # Long operations: ffmpeg transcodes can take minutes
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback (query params drive the mode, so just serve index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: cache aggressively (content-hashed by vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}