name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  player:
    name: Player (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: player/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

  # Detects whether the daemon exists yet; avoids hashFiles quirks by
  # checking the filesystem at runtime.
  changes:
    runs-on: ubuntu-latest
    outputs:
      daemon: ${{ steps.f.outputs.daemon }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        run: |
          if [ -f ibercastd/go.mod ]; then
            echo "daemon=true" >> "$GITHUB_OUTPUT"
          else
            echo "daemon=false" >> "$GITHUB_OUTPUT"
          fi

  daemon:
    name: Daemon (vet + build + test)
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ibercastd
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
