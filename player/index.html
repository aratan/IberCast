<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07090c" />
  <title>IberCast · Streaming P2P sobre IPFS</title>
</head>
<body>
  <!-- Wall mode (?mode=wall or default) — nav + hero + rails + watch view -->
  <div id="wall-root"></div>

  <!-- Admin mode (?mode=admin) -->
  <div id="admin-root"></div>

  <!-- Viewer mode (?mode=viewer) -->
  <div id="viewer">
    <video id="video-viewer" controls autoplay playsinline></video>
    <div id="status-viewer">Cargando parrilla…</div>
  </div>

  <!-- Legacy mode (?mode=legacy or ?cid=...) -->
  <div id="legacy">
    <div class="bar">
      <input id="cid" type="text" placeholder="CID raíz del manifiesto HLS (bafy... o Qm...)" />
      <button id="go">Reproducir</button>
    </div>
    <video id="video" controls playsinline></video>
    <div id="status">Introduce un CID publicado con ibercastd y pulsa Reproducir.</div>
    <div class="hud">
      <div class="card-x"><div class="k">Peers conectados</div><div class="v" id="m-peers">–</div></div>
      <div class="card-x"><div class="k">Segmentos P2P</div><div class="v p2p" id="m-p2p">0</div></div>
      <div class="card-x"><div class="k">Vía gateway (HTTP)</div><div class="v http" id="m-http">0</div></div>
      <div class="card-x"><div class="k">Desde caché local</div><div class="v cache" id="m-cache">0</div></div>
      <div class="card-x"><div class="k">Bytes P2P</div><div class="v" id="m-bytes-p2p">0 B</div></div>
      <div class="card-x"><div class="k">Bytes HTTP</div><div class="v" id="m-bytes-http">0 B</div></div>
    </div>
    <footer>Último segmento resuelto por: <span id="m-last">–</span></footer>
    <div id="activity"><span class="dot"></span><span id="activity-txt">Cargando…</span></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
