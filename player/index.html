<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IberCast · P2P Player</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0b0f14; color: #dbe4ee;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
    }
    h1 { font-size: 1.3rem; margin: 0 0 4px; letter-spacing: .5px; }
    h1 span { color: #4cc38a; }
    .sub { color: #7d8b9c; font-size: .85rem; margin-bottom: 18px; }
    .bar { display: flex; gap: 8px; width: min(880px, 100%); margin-bottom: 14px; }
    input {
      flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #233140;
      background: #101820; color: #dbe4ee; font-size: .9rem; font-family: ui-monospace, monospace;
    }
    input:focus { outline: none; border-color: #4cc38a; }
    button {
      padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer;
      background: #4cc38a; color: #06281a; font-weight: 700; font-size: .9rem;
    }
    button:hover { filter: brightness(1.1); }
    video {
      width: min(880px, 100%); border-radius: 10px; background: #000;
      border: 1px solid #1a2530; aspect-ratio: 16/9;
    }
    #status { width: min(880px, 100%); margin: 10px 2px 4px; color: #8fa3b8; font-size: .82rem; min-height: 1.2em; }
    .hud {
      width: min(880px, 100%); margin-top: 12px; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;
    }
    .card {
      background: #101820; border: 1px solid #1a2530; border-radius: 10px;
      padding: 10px 12px;
    }
    .card .k { color: #7d8b9c; font-size: .72rem; text-transform: uppercase; letter-spacing: .8px; }
    .card .v { font-size: 1.15rem; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .card .v.p2p { color: #4cc38a; }
    .card .v.http { color: #e0a84c; }
    .card .v.cache { color: #5cb3e0; }
    footer { margin-top: 22px; color: #46566a; font-size: .75rem; }
  </style>
</head>
<body>
  <h1>Iber<span>Cast</span></h1>
  <div class="sub">Streaming P2P sobre IPFS — cada espectador reparte fragmentos vía WebRTC</div>

  <div class="bar">
    <input id="cid" type="text" placeholder="CID raíz del manifiesto HLS (bafy... o Qm...)" />
    <button id="go">Reproducir</button>
  </div>

  <video id="video" controls playsinline></video>
  <div id="status">Introduce un CID publicado con ibercastd y pulsa Reproducir.</div>

  <div class="hud">
    <div class="card"><div class="k">Peers conectados</div><div class="v" id="m-peers">–</div></div>
    <div class="card"><div class="k">Segmentos P2P</div><div class="v p2p" id="m-p2p">0</div></div>
    <div class="card"><div class="k">Vía gateway (HTTP)</div><div class="v http" id="m-http">0</div></div>
    <div class="card"><div class="k">Desde caché local</div><div class="v cache" id="m-cache">0</div></div>
    <div class="card"><div class="k">Bytes P2P</div><div class="v" id="m-bytes-p2p">0 B</div></div>
    <div class="card"><div class="k">Bytes HTTP</div><div class="v" id="m-bytes-http">0 B</div></div>
  </div>

  <footer>Último segmento resuelto por: <span id="m-last">–</span></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
